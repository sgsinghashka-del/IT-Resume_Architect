    <text x="195" y="438" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Skills Extracted</text>
    <text x="155" y="500" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">12</text>
    <text x="155" y="535" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">core capabilities mapped</text>

    <rect x="155" y="555" width="155" height="8" rx="4" fill="#22D3EE" fill-opacity="0.8"/>
