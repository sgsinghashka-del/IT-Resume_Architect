    <text x="988" y="470" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Offline Mode</text>
    <text x="988" y="500" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Secure & deterministic</text>
