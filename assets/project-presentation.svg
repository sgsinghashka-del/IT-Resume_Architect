    <text x="485" y="438" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Role Match</text>
    <text x="450" y="500" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">92%</text>
    <text x="450" y="535" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">alignment score</text>

