    <text x="1150" y="313" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">+8</text>
    <text x="1154" y="339" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">skills</text>

    <rect x="720" y="420" width="220" height="110" rx="16" fill="#111827"/>
    <text x="748" y="470" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Prompt Engine</text>
    <text x="748" y="500" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Context + extraction + scoring</text>

